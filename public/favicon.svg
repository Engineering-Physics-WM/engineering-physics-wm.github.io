<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#f5f0e8"/>
  <!-- E: vertical bar -->
  <path d="M 12 8 L 12 56" fill="none" stroke="#2c2b1f" stroke-width="9" stroke-linecap="square"/>
  <!-- E: horizontals — top, middle, bottom -->
  <path d="M 12 8 L 36 8"  fill="none" stroke="#2c2b1f" stroke-width="9" stroke-linecap="square"/>
  <path d="M 12 32 L 30 32" fill="none" stroke="#2c2b1f" stroke-width="9" stroke-linecap="square"/>
  <path d="M 12 56 L 36 56" fill="none" stroke="#2c2b1f" stroke-width="9" stroke-linecap="square"/>
  <!-- P: shared stem + bowl that interlocks with E's middle bar -->
  <path d="M 36 8 L 36 56"  fill="none" stroke="#2c2b1f" stroke-width="9" stroke-linecap="square"/>
  <path d="M 36 8 Q 56 8 56 20 Q 56 32 36 32" fill="none" stroke="#2c2b1f" stroke-width="9" stroke-linecap="square"/>
</svg>
